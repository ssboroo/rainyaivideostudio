name: CI
on:
  push:
    branches: [main, production-v1]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ravs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ravs?schema=public
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      APP_URL: http://localhost:3000
      INTEGRATION_DATABASE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Production dependency audit
        run: npm run audit:prod
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify Railway Docker image builds
        run: docker build -t ravs:ci .
